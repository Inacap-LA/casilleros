name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: casilleros-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python del runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Pruebas de sintaxis y base SQLite
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q main.py database.py corregir_apk_python.py
          if [ -f test_database.py ]; then
            python -m unittest -v test_database
          elif [ -f tests/test_database.py ]; then
            python -m unittest discover -s tests -p 'test_*.py' -v
          else
            echo '::error::Falta test_database.py (o tests/test_database.py)'
            exit 1
          fi
          python - <<'PYCODE'
          from pathlib import Path
          import sqlite3
          archivo = Path('casilleros.db')
          if not archivo.exists():
              raise SystemExit('ERROR: falta casilleros.db')
          con = sqlite3.connect(f'file:{archivo}?mode=ro', uri=True)
          assert con.execute('PRAGMA quick_check').fetchone()[0] == 'ok'
          print('Integridad SQLite: OK')
          con.close()
          PYCODE

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache git libffi-dev libssl-dev zip unzip \
            zlib1g-dev libltdl-dev autoconf libtool pkg-config \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake automake \
            autopoint gettext patchelf binutils

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'cython==0.29.36' 'buildozer==1.6.0'
          buildozer --version

      - name: Cache SDK NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.ccache
          key: ${{ runner.os }}-casilleros-v27-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-casilleros-v27-

      # IMPORTANTE: La misma clave se reutiliza siempre. Nunca generar una
      # nueva en el runner: eso impediria actualizar la app instalada.
      - name: Restaurar firma persistente desde GitHub Secrets
        shell: bash
        env:
          CASILLEROS_DEBUG_KEYSTORE_B64: ${{ secrets.CASILLEROS_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$CASILLEROS_DEBUG_KEYSTORE_B64" ]; then
            echo "::error::Falta el secreto CASILLEROS_DEBUG_KEYSTORE_B64. Preparalo desde tu Mac antes de ejecutar este workflow."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          chmod 700 "$HOME/.android"
          printf '%s' "$CASILLEROS_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android >/dev/null
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "Firma persistente restaurada y validada."

      - name: Compilar APK debug original
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Corregir biblioteca Python y firmar APK v28
        run: |
          python corregir_apk_python.py --output bin/casilleros-v28-debug.apk

      - name: Publicar solo el APK corregido
        uses: actions/upload-artifact@v4
        with:
          name: Casilleros-Inacap-APK-v28-Firma-Estable
          path: bin/casilleros-v28-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publicar log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Casilleros-Inacap-Log-Error
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 7
